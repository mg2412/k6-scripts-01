# Standalone K6 + InfluxDB + Grafana stack for PLAT-4287.
# Not coupled to any application repo. Run from this directory:
#
#   docker compose up -d influxdb grafana
#   docker compose run --rm k6 run /scripts/smoke.js
#   docker compose run --rm k6 run /scripts/teachers.js
#   docker compose run --rm k6 run /scripts/students.js
#
# Grafana on http://localhost:3000  (admin / admin)

services:
  influxdb:
    image: influxdb:1.8
    container_name: plat4287-influxdb
    expose:
      - "8086"
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_HTTP_AUTH_ENABLED=false
    volumes:
      - influxdb-data:/var/lib/influxdb

  grafana:
    image: grafana/grafana:8.5.21
    container_name: plat4287-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_BASIC_ENABLED=false
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - influxdb

  k6:
    image: grafana/k6:latest
    container_name: plat4287-k6
    # ulimits raise the per-container fd cap so a single host can
    # sustain tens of thousands of simultaneous TCP flows.
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
      - K6_INFLUXDB_PUSH_INTERVAL=5s
      - A2_HOST_URL=${A2_HOST_URL:-https://services.elclouduat.net}
      - TARGET_VUS=${TARGET_VUS:-}
      - RAMP_SECONDS=${RAMP_SECONDS:-}
      - HOLD_SECONDS=${HOLD_SECONDS:-}
      - RAMPDOWN_SECONDS=${RAMPDOWN_SECONDS:-}
      - K6_INSECURE_SKIP_TLS_VERIFY=true
    volumes:
      - ./scripts:/scripts:ro
      - ./lib:/lib:ro
      - ./data:/data:ro
    depends_on:
      - influxdb
    # entrypoint left as default `k6` so callers pass `run /scripts/*.js`

volumes:
  influxdb-data:
  grafana-data:
